name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # release.yml passes this too, and it is the one input the release job
          # uses that no pull request would otherwise exercise: it writes the
          # .npmrc that npm publish authenticates with. Passing it here writes
          # the same file and publishes nothing, so a setup-node bump that broke
          # the publish path fails on the PR instead of on the release.
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      # Catches a regression in the exports map or the dual ESM/CJS type
      # declarations, which a passing test suite would not notice.
      - name: Check published type resolution
        run: bunx --yes @arethetypeswrong/cli@latest --pack .
